<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Frontend 1.0</title>
</head>
<body>
    <h1>Frontend 1.0</h1>
    <input type="text" id="textInput" placeholder="Введите текст...">
    <button id="submitBtn">Отправить</button>
    <p id="status"></p>
    <h2>Чтение данных из файла</h2>
    <button id="readBtn">Прочитать</button>
    <p id="readStatus"></p>
    <textarea id="fileContent" readonly rows="5" cols="40"></textarea>

    <script>
        const API_URL = 'http://backend:5000/submit';

        document.getElementById('submitBtn').addEventListener('click', async () => {

            const text = document.getElementById('textInput').value;
            const statusEl = document.getElementById('status');

            if (!text) {
                statusEl.textContent = 'Введите текст!';
                return;
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await response.json();
                statusEl.textContent = 'Ответ сервера: ' + JSON.stringify(data);
            } catch (error) {
                statusEl.textContent = 'Ошибка: ' + error.message;
            }
        });

        const READ_URL = 'http://backend:5000/read';

        document.getElementById('readBtn').addEventListener('click', async () => {
            const statusEl = document.getElementById('readStatus');
            const contentEl = document.getElementById('fileContent');

            try {
                const response = await fetch(READ_URL);
                const data = await response.json();

                if (data.status === 'ok') {
                    statusEl.textContent = 'Данные успешно получены';
                    contentEl.value = data.content || '(файл пуст)';
                } else {
                    statusEl.textContent = 'Ошибка при чтении';
                    contentEl.value = '';
                }
            } catch (error) {
                statusEl.textContent = 'Ошибка: ' + error.message;
                contentEl.value = '';
            }
        });
    </script>
</body>
</html>
